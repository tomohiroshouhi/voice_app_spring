<!DOCTYPE html>
<html lang="ja-JP">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="load.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-giJF6kkoqNQ00vy+HMDP7azOuL0xtbfIcaT9wjKHr8RbDVddVHyTfAAsrekwKmP1" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/js/bootstrap.bundle.min.js" integrity="sha384-ygbV9kiqUc6oa4msXn9868pTtWMgiQaeYH7/t7LECLbyPA2x65Kgf80OJFdroafW" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js" integrity="sha384-q2kxQ16AaE6UbzuKqyBE9/u/KzioAlnx2maXQHiDX9d4/zp8Ok3f+M7DPm+Ib6IU" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/js/bootstrap.min.js" integrity="sha384-pQQkAEnwaBkjpqZ8RU1fF1AKtTcHJwFl3pblpTlHXybJjHpMYo79HY3hIi4NKxyj" crossorigin="anonymous"></script>
</head>
<body>
    <div id="record-message" class="p-1 text-center bg-warning">
        <p class="">録音中です。</p>
    </div>
    <div>
        <div class="p-5 text-center">
            <div class="row">
                <div class="col-md">
                    <button class="start btn btn-primary" onclick="startRecording(this)">録音開始</button>
                </div>
                <div class="col-md">
                    <button class="stop btn btn-danger" onclick="stopRecording(this)">録音終了</button>
                </div>
                <div class="col-md">
                    <button class="clear btn btn-warning" onclick="clearDom(this)">結果クリア</button>
                </div>
            </div>
        </div>
        <div id="result" class="p-5 text-center"></div>
        <div id="items" style="display: none">
            <table id="result-table" class="table table-success table-striped">
                <thead>
                    <tr>
                        <th scope="col">見つかった単語</th>
                        <th scope="col">何文字目</th>
                        <th scope="col">前の5文字</th>
                        <th scope="col">後ろ5文字</th>
                    </tr>
                </thead>
                <tbody id="tb">
                </tbody>
            </table>
            <div class="row">
                <div class="col-md">
                    <button class="opt-csv btn btn-success" onclick="outputCsv(this)">CSV出力</button>
                    <a style="display: none" id="downloader" href="#"></a>
                </div>
            </div>
        </div>
    </div>
    <div id="overlay">
        <div class="cv-spinner">
            <span class="spinner"></span>
        </div>
    </div>

    <script src="./api_key.js"></script>
    <script src="./main.js"></script>
    <script src="./dist/recorder.js"></script>
</body>
</html>
